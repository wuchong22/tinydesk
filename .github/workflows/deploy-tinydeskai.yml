name: Deploy tinydeskai

# Manual production deploy of sites/tinydeskai-example only. Existing CI is unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tinydeskai-example
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy tinydeskai-example
        working-directory: sites/tinydeskai-example
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b5a8590f2eb38ce040cda33a09b47b3d
        run: pnpm run deploy
